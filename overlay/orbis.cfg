//
// Prefs that no enterprise policy covers. Policies (distribution/policies.json) come first; this file adds
// the rest. Every name here has a row in docs/SETTINGS.md and is checked against the pinned Firefox source by
// scripts/check-settings.py.
//
//   lockPref    = set and locked: the user cannot change it, not even in about:config.
//   defaultPref = Orbis default: the user can change it, and the change is kept.
//
// This file runs in Firefox's AutoConfig sandbox (release channel), so only the pref functions are available.

// ---- Telemetry: locked off ------------------------------------------------------------------------------
// The DisableTelemetry policy already locks datareporting.healthreport.uploadEnabled,
// datareporting.policy.dataSubmissionEnabled, datareporting.usage.uploadEnabled and
// toolkit.telemetry.archive.enabled. These close the remaining switches and endpoints.
lockPref("toolkit.telemetry.unified", false);
lockPref("toolkit.telemetry.enabled", false);
lockPref("toolkit.telemetry.server", "data:,");
lockPref("toolkit.telemetry.newProfilePing.enabled", false);
lockPref("toolkit.telemetry.updatePing.enabled", false);
lockPref("toolkit.telemetry.firstShutdownPing.enabled", false);
lockPref("toolkit.telemetry.shutdownPingSender.enabled", false);
lockPref("toolkit.telemetry.bhrPing.enabled", false);
lockPref("toolkit.telemetry.dap.leader.url", "");
lockPref("toolkit.telemetry.dap.helper.url", "");
lockPref("browser.newtabpage.activity-stream.telemetry", false);
lockPref("browser.search.serpEventTelemetryCategorization.enabled", false);
lockPref("browser.discovery.enabled", false);
lockPref("browser.tabs.crashReporting.sendReport", false);
lockPref("browser.crashReports.unsubmittedCheck.autoSubmit2", false);

// ---- Studies and experiments: locked off ----------------------------------------------------------------
// The DisableFirefoxStudies and DisableRemoteImprovements policies switch off Shield and Nimbus rollouts.
lockPref("app.normandy.enabled", false);
lockPref("app.normandy.api_url", "");
lockPref("app.shield.optoutstudies.enabled", false);
lockPref("nimbus.rollouts.enabled", false);

// ---- Firefox accounts and sync: locked off --------------------------------------------------------------
// Not the DisableAccounts policy: besides this pref it also locks browser.aboutwelcome.enabled to false, which
// would remove the uBlock Origin consent screen below. This pref is the policy's only other effect.
lockPref("identity.fxaccounts.enabled", false);

// ---- Google Safe Browsing: locked off, endpoints blanked ------------------------------------------------
// Owner decision 2026-11-12: no Google Safe Browsing. Malware and phishing protection comes from uBlock
// Origin's lists (see policies.json, 3rdparty). Endpoints are blanked as well, so that switching a list back
// on in a future Firefox version cannot reach Google. Tracking protection uses the separate "mozilla"
// provider, which is not touched here.
lockPref("browser.safebrowsing.malware.enabled", false);
lockPref("browser.safebrowsing.phishing.enabled", false);
lockPref("browser.safebrowsing.downloads.enabled", false);
lockPref("browser.safebrowsing.downloads.remote.enabled", false);
lockPref("browser.safebrowsing.downloads.remote.url", "");
lockPref("browser.safebrowsing.downloads.remote.block_potentially_unwanted", false);
lockPref("browser.safebrowsing.downloads.remote.block_uncommon", false);
lockPref("browser.safebrowsing.provider.google.updateURL", "");
lockPref("browser.safebrowsing.provider.google.gethashURL", "");
lockPref("browser.safebrowsing.provider.google4.updateURL", "");
lockPref("browser.safebrowsing.provider.google4.gethashURL", "");
lockPref("browser.safebrowsing.provider.google4.dataSharingURL", "");
lockPref("browser.safebrowsing.provider.google4.dataSharing.enabled", false);
lockPref("browser.safebrowsing.provider.google5.enabled", false);
lockPref("browser.safebrowsing.provider.google5.updateURL", "");
lockPref("browser.safebrowsing.provider.google5.gethashURL", "");
// Real-time lookups and the global cache are Nightly-only in 160; locked so a later version cannot turn them on.
lockPref("browser.safebrowsing.realTime.enabled", false);
lockPref("browser.safebrowsing.globalCache.enabled", false);

// ---- Widevine from Google's update service: locked off ----------------------------------------------------
// GMPInstallManager asks Google's Chromium component updater (update.googleapis.com) about Widevine once a day
// when these are true, before it checks whether DRM is enabled. Widevine, if the user turns DRM on, then comes
// from Mozilla's GMP manifest only. The -l1 pref exists only in x64 builds with MOZ_WMF_CDM.
lockPref("media.gmp-widevinecdm.allow-chromium-update", false);
lockPref("media.gmp-widevinecdm-l1.allow-chromium-update", false);

// ---- Other Mozilla services: locked off --------------------------------------------------------------------
// MITM priming: on a certificate error Firefox fetches mitmdetection.services.mozilla.com.
lockPref("security.certerrors.mitm.priming.enabled", false);
// Contile: sponsored top sites from Mozilla's server (the FirefoxHome policy already hides them).
lockPref("browser.topsites.contile.enabled", false);
// New-tab default top sites: none (Shibi, 2026-11-12). Otherwise Firefox 160 takes them from the Remote
// Settings "top-sites" collection, which adds "Add-ons for Firefox" (Firefox logo) when no region is known,
// and Orbis turns region lookup off. A locked value is used as it is, before Remote Settings or Contile are
// asked (_readDefaults in TopSitesFeed.sys.mjs and TopSites.sys.mjs); "" gives no default sites.
lockPref("browser.newtabpage.activity-stream.default.sites", "");
// about:addons "Recommendations" pane and recommended add-ons: content fetched from addons.mozilla.org.
lockPref("extensions.getAddons.showPane", false);
lockPref("extensions.htmlaboutaddons.recommendations.enabled", false);
// AMO metadata cache (Shibi, 2026-11-12): no daily request that sends the IDs of installed add-ons to
// services.addons.mozilla.org. Add-on updates do not use this cache; they ask versioncheck-bg.addons.mozilla.org.
lockPref("extensions.getAddons.cache.enabled", false);

// ---- Mozilla promotions: locked off ------------------------------------------------------------------------
// Firefox Relay (email masks; needs a Mozilla account, which DisableAccounts already blocks). "" is not one of
// the values LoginHelper accepts, so the feature is not available at all.
lockPref("signon.firefoxRelay.feature", "");
// about:protections: Monitor card (already false in 160), VPN card, and the Firefox mobile-app promotion.
lockPref("browser.contentblocking.report.monitor.enabled", false);
lockPref("browser.vpn_promo.enabled", false);
lockPref("browser.contentblocking.report.show_mobile_app", false);
// UITour lets Mozilla web pages drive tours of the browser UI.
lockPref("browser.uitour.enabled", false);

// ---- Region lookup: locked off --------------------------------------------------------------------------
// Firefox asks a location service which country the user is in (used for search and new-tab content).
lockPref("browser.region.network.url", "");
lockPref("browser.region.update.enabled", false);

// ---- Network checks: Orbis defaults, user can change ----------------------------------------------------
// Captive-portal and connectivity checks contact a Mozilla server on start and on network changes.
defaultPref("network.captive-portal-service.enabled", false);
defaultPref("network.connectivity-service.enabled", false);

// ---- First run: uBlock Origin consent screen (Store policy 10.1.5) ----------------------------------------
// Nothing installs uBlock Origin without the user's choice: policies.json only allows it. The first window of
// a new profile opens about:welcome (Firefox's onboarding page, local content only) with these screens. The
// checkbox is on by default. "Continue" with it on starts the install from addons.mozilla.org and moves to the
// second screen, which stays up while Firefox shows its own "Add uBlock Origin?" permission prompt (leaving
// about:welcome cancels an install whose prompt is still open; moving between its screens does not). "Continue"
// with it off records the choice and opens the home page. The choice is stored as
// messaging-system-action.orbis.ubo.consent ("accepted" or "declined"; SET_PREF puts that prefix on every pref
// outside Firefox's allow-list). Firefox opens the welcome page only for a new profile, so the screen is never
// shown twice. scripts/check-settings.py reads ORBIS_UBO_CONSENT_SCREENS as JSON: keep it strict JSON (double
// quotes, no comments, no trailing commas), and keep the install in the checkbox's checkedAction only.
var ORBIS_UBO_CONSENT_SCREENS = [
  {
    "id": "ORBIS_UBO_CONSENT",
    "content": {
      "position": "center",
      "logo": {"imageURL": "chrome://branding/content/about-logo.svg"},
      "title": {"raw": "Block ads and trackers?"},
      "subtitle": {"raw": "uBlock Origin is a separate GPL-3.0 project by its own authors. It is not made or endorsed by Orbis or Mozilla, and it is not included in Orbis. Orbis contacts Mozilla Add-ons (addons.mozilla.org) to download it and to check for updates, and uBlock Origin then downloads its own filter lists. Orbis chooses those lists, including a phishing list, at every start."},
      "tiles": {
        "type": "multiselect",
        "style": {"marginBlock": "16px 0"},
        "data": [
          {
            "id": "orbis-install-ubo",
            "defaultValue": true,
            "label": {"raw": "Install uBlock Origin ad blocker"},
            "checkedAction": {
              "type": "MULTI_ACTION",
              "data": {
                "orderedExecution": true,
                "actions": [
                  {"type": "SET_PREF", "data": {"pref": {"name": "orbis.ubo.consent", "value": "accepted"}}},
                  {"type": "INSTALL_ADDON_FROM_URL", "data": {"url": "https://addons.mozilla.org/firefox/downloads/latest/uBlock0@raymondhill.net/latest.xpi"}}
                ]
              }
            },
            "uncheckedAction": {
              "type": "MULTI_ACTION",
              "data": {
                "orderedExecution": true,
                "actions": [
                  {"type": "SET_PREF", "data": {"pref": {"name": "orbis.ubo.consent", "value": "declined"}}},
                  {"type": "OPEN_ABOUT_PAGE", "data": {"args": "home", "where": "current"}}
                ]
              }
            },
            "uncheckedNotice": {
              "title": {"raw": "uBlock Origin will not be installed."},
              "subtitle": {"raw": "Strict tracking protection stays on. You can install uBlock Origin later: open Add-ons and themes and search for uBlock Origin."}
            }
          }
        ]
      },
      "primary_button": {
        "label": {"raw": "Continue"},
        "action": {"type": "MULTI_ACTION", "collectSelect": true, "navigate": true, "data": {"orderedExecution": true, "actions": []}}
      }
    }
  },
  {
    "id": "ORBIS_UBO_INSTALLING",
    "content": {
      "position": "center",
      "logo": {"imageURL": "chrome://branding/content/about-logo.svg"},
      "title": {"raw": "Installing uBlock Origin..."},
      "subtitle": {"raw": "Choose Add in the prompt to finish. If you leave this page before that, uBlock Origin is not installed."},
      "primary_button": {"label": {"raw": "Start browsing"}, "action": {"navigate": true}}
    }
  }
];
lockPref("browser.aboutwelcome.enabled", true);
lockPref("browser.aboutwelcome.screens", JSON.stringify(ORBIS_UBO_CONSENT_SCREENS));
// No splash screen that waits for Nimbus experiments (Nimbus is off; see "Studies and experiments").
lockPref("browser.aboutwelcome.experimentsGate.enabled", false);
// The branding sets both to "" (no Mozilla welcome page); Orbis's welcome page is the consent screen above.
lockPref("startup.homepage_welcome_url", "about:welcome");
lockPref("startup.homepage_welcome_url.additional", "");

// ---- Enhanced Tracking Protection: Strict once, then the user's choice ----------------------------------
// The EnableTrackingProtection policy locks the category when it sets one, so Strict is set here instead.
// Firefox only applies a category that has a user value, so this sets one on the first start of a profile
// and records that it did. After that the user's choice (Standard, Strict or Custom) is kept.
if (getPref("orbis.privacy.etpStrictApplied") !== true) {
  pref("browser.contentblocking.category", "strict");
  pref("orbis.privacy.etpStrictApplied", true);
}
