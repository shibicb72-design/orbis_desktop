  </g>
  <circle cx="128" cy="128" r="58" fill="#9AD3CF"/>
  <g transform="rotate(-28 128 128)">
    <path d="M232,128 A104,40 0 0 1 24,128" fill="none" stroke="#216969" stroke-width="30"/>
    <path d="M232,128 A104,40 0 0 1 24,128" fill="none" stroke="#F4F7F7" stroke-width="16" stroke-linecap="round"/>
    <circle cx="180" cy="162.6" r="20" fill="#216969"/>
    <circle cx="180" cy="162.6" r="14" fill="#F4F7F7"/>
  </g>
</svg>
